[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wuji2-control"
version = "0.1.0"
description = "Wuji Hand 2 communication, supervised joint control, and gesture examples"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Frank Zhiyang Dou", email = "frankdou@mit.edu"}]
dependencies = ["numpy>=2.2,<3"]

[project.optional-dependencies]
hardware = ["wuji-sdk==2026.8.31"]
model = ["mujoco>=3.3.7,<4"]
camera = ["opencv-python-headless>=4.10,<6"]
dev = ["pytest>=7.4,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
wuji2 = "wuji2_control.cli:main"

[project.urls]
Repository = "https://github.com/Frank-ZY-Dou/Dynamics-Modeling"
Issues = "https://github.com/Frank-ZY-Dou/Dynamics-Modeling/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: checks against a locally installed official Wuji model"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
