model_type: transformer
normalize_features: true
num_heads: 4
num_layers: 4
pool_type: mean
pos_loss_weight: 100.0
qvel_clip: 10.0
rollout_steps: 64
seed: 0
sim_step_size: 4
use_gated_attention: true
weight_decay: 0.0001
