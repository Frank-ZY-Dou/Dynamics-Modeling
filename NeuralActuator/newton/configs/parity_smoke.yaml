batch_size: 8
d_ff: 384
data_dt: 0.017
datasets:
- data/weight/pick_place_object_500g/train/001.csv
- data/weight/go_up_and_stay_still_with_object_400g/train/001.csv
downsample_factor: 1
dropout_rate: 0.1
