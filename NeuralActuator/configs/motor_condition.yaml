model_type: transformer
hidden_dim: 192
latent_dim: 96
num_heads: 4
num_layers: 4
d_ff: 384
pool_type: "mean"
use_gated_attention: true
dropout_rate: 0.1
feature_dim: 36
history_length: 8

epochs: 100000
batch_size: 16
lr: 1e-4
lr_schedule: cosine
lr_warmup_epochs: 1000
grad_clip: 1.0
weight_decay: 0.0001
ema_decay: 0.999
zero_init_torque_head: false
skip_nonfinite_updates: true

rollout_steps: 128
curriculum_epochs: [2000, 5000]
curriculum_steps: [128, 128]
data_dt: 0.017
downsample_factor: 1
sim_step_size: 4
mjcf_path: robot/scene.xml

use_residual_torque: false
torque_constant: 1.3
init_pos_noise_std: 0.15
goal_aperture_noise_std: 0.0
normalize_features: true
qvel_clip: 10.0
gripper_torque_clip: 1.5

pos_loss_weight: 100.0
gripper_loss_weight: 0.02
force_loss_weight: 0.0
gate_loss_weight: 0.0
condition_loss_weight: 100.0
force_focal_weight: 5.0
gate_focal_weight: 0.0
mask_invalid_force: false

val_interval: 10
eval_interval: 100
target_mae_threshold: 0.8
target_gripper_threshold: 0.15
target_force_threshold: 0.25
target_condition_threshold: 0.999
save_best_by: condition_accuracy
log_dir: "outputs/logs_motor_condition"

datasets:
  - data/motor_condition/pick_place_empty/train/001.csv
  - data/motor_condition/pick_place_empty/train/002.csv
  - data/motor_condition/pick_place_empty/train/003.csv
  - data/motor_condition/pick_place_empty/train/004.csv
  - data/motor_condition/pick_place_empty/train/005.csv
  - data/motor_condition/pick_place_empty/train/006.csv
  - data/motor_condition/pick_place_empty/train/007.csv
  - data/motor_condition/pick_place_empty/train/008.csv
  - data/motor_condition/pick_place_object_200g/train/001.csv
  - data/motor_condition/pick_place_object_200g/train/002.csv
  - data/motor_condition/pick_place_object_200g/train/003.csv
  - data/motor_condition/pick_place_object_200g/train/004.csv
  - data/motor_condition/pick_place_object_200g/train/005.csv
  - data/motor_condition/pick_place_object_200g/train/006.csv
  - data/motor_condition/pick_place_object_200g/train/007.csv
  - data/motor_condition/pick_place_object_200g/train/008.csv
  - data/motor_condition/pick_place_empty_degrade/train/001.csv
  - data/motor_condition/pick_place_empty_degrade/train/002.csv
  - data/motor_condition/pick_place_empty_degrade/train/003.csv
  - data/motor_condition/pick_place_empty_degrade/train/004.csv
  - data/motor_condition/pick_place_empty_degrade/train/005.csv
  - data/motor_condition/pick_place_empty_degrade/train/006.csv
  - data/motor_condition/pick_place_empty_degrade/train/007.csv
  - data/motor_condition/pick_place_empty_degrade/train/008.csv
  - data/motor_condition/pick_place_object_200g_degrade/train/001.csv
  - data/motor_condition/pick_place_object_200g_degrade/train/002.csv
  - data/motor_condition/pick_place_object_200g_degrade/train/003.csv
  - data/motor_condition/pick_place_object_200g_degrade/train/004.csv
  - data/motor_condition/pick_place_object_200g_degrade/train/005.csv
  - data/motor_condition/pick_place_object_200g_degrade/train/006.csv
  - data/motor_condition/pick_place_object_200g_degrade/train/007.csv
  - data/motor_condition/pick_place_object_200g_degrade/train/008.csv

val_datasets:
  - data/motor_condition/pick_place_empty/validation/001.csv
  - data/motor_condition/pick_place_object_200g/validation/001.csv
  - data/motor_condition/pick_place_empty_degrade/validation/001.csv
  - data/motor_condition/pick_place_object_200g_degrade/validation/001.csv

test_datasets:
  pick_place_empty: data/motor_condition/pick_place_empty/test/001.csv
  pick_place_object_200g: data/motor_condition/pick_place_object_200g/test/001.csv
  pick_place_empty_degrade: data/motor_condition/pick_place_empty_degrade/test/001.csv
  pick_place_object_200g_degrade: data/motor_condition/pick_place_object_200g_degrade/test/001.csv
