model_type: transformer
hidden_dim: 192
latent_dim: 96
num_heads: 4
num_layers: 4
d_ff: 384
pool_type: "mean"
use_gated_attention: true
dropout_rate: 0.1
feature_dim: 36
history_length: 8

epochs: 100000
batch_size: 16
lr: 1e-4
lr_schedule: cosine
lr_warmup_epochs: 1000
grad_clip: 1.0
weight_decay: 0.0001
ema_decay: 0.999
zero_init_torque_head: false
skip_nonfinite_updates: true

rollout_steps: 320
curriculum_epochs: [2000, 5000]
curriculum_steps: [128, 256]
data_dt: 0.017
downsample_factor: 1
sim_step_size: 4
mjcf_path: robot/scene.xml

use_residual_torque: false
torque_constant: 1.3
init_pos_noise_std: 0.15
goal_aperture_noise_std: 0.0
normalize_features: true
qvel_clip: 10.0
gripper_torque_clip: 1.5

pos_loss_weight: 100.0
gripper_loss_weight: 0.02
force_loss_weight: 30.0
gate_loss_weight: 1.0
condition_loss_weight: 0.0
force_focal_weight: 5.0
gate_focal_weight: 0.0
mask_invalid_force: false

val_interval: 10
eval_interval: 100
target_mae_threshold: 2.0
target_gripper_threshold: 0.5
target_force_threshold: 0.25
target_condition_threshold: 0.0
log_dir: "outputs/logs_weight_all"

