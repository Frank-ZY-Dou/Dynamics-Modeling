# Franka Panda lift-and-hold, fine-tune stage 1: a short low-LR cosine anneal.
# Starting checkpoint: the best_test output of the scratch run
# (scripts/train_franka_lift_hold.sh).
resume_from: outputs/franka_lift_hold_params_best_test.pkl
model_type: transformer
hidden_dim: 192
latent_dim: 96
num_heads: 4
num_layers: 4
d_ff: 384
pool_type: "mean"
use_gated_attention: true
dropout_rate: 0.1
feature_dim: 52
history_length: 8

epochs: 1400
batch_size: 16
lr: 1.2e-5
lr_schedule: cosine
lr_warmup_epochs: 100
lr_decay_epochs: 1200
grad_clip: 1.0
weight_decay: 0.0001
ema_decay: 0.999
seed: 2

rollout_steps: 128  # short windows sampled inside trajectories (per-trajectory masking)
data_dt: 0.016  # 62.5 Hz
downsample_factor: 1
sim_step_size: 8  # physics dt = 0.002 s, the plant design timestep
mjcf_path: robot_franka/scene.xml

# Trim noisy trajectory boundaries (pre-lift setup and post-release settling)
trim_start: 0.30
trim_end: 0.25

# Lookahead target: replace cmd_pos (step function) with pos[t+K] * scale
lookahead_frames: 5
lookahead_scale: 1.03

use_residual_torque: false
torque_constant: 1.0
backbone_activation: silu
init_pos_noise_std: 0.15

pos_loss_weight: 100.0
gripper_loss_weight: 0.0
vel_loss_weight: 5.0
force_loss_weight: 1.0
gate_loss_weight: 1.0
condition_loss_weight: 0.0
force_focal_weight: 1.0  # force is present in every frame, focal weighting unnecessary
force_huber_beta: 0.15

# Cap total loss to prevent gradient explosion from bad batches
loss_clamp: 500.0

# Per-joint pose-loss weights: higher weight on the wrist joints (+-12 Nm limit);
# J6 gets 2x for its high velocity range
joint_loss_weights: [1.0, 1.0, 1.0, 1.0, 1.5, 2.0, 1.5]

val_interval: 10
eval_interval: 50
eval_ema_params: true
target_mae_threshold: 1.5
target_gripper_threshold: 0.3
target_force_threshold: 0.2
log_dir: "outputs/logs_franka_lift_hold_ft1"

# Training: 5 payloads x 6 trials
datasets:
  - data/franka/lift_hold/train/200_001.csv
  - data/franka/lift_hold/train/200_002.csv
